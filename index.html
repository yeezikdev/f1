<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PIT WALL — F1 Team Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0D11;
  --surface:#12171D;
  --surface2:#1A2129;
  --surface3:#212B34;
  --line:#2A343E;
  --red:#E10600;
  --red-dim:#5c0f0c;
  --green:#00D9A3;
  --amber:#FFB627;
  --text:#F2F3F0;
  --muted:#8B93A0;
  --muted2:#5c6570;
  --font-display:'Titillium Web',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-tap-highlight-color:transparent;}
body{padding-bottom:76px;min-height:100vh;background:
  radial-gradient(circle at 15% 0%, rgba(225,6,0,0.08), transparent 45%),
  radial-gradient(circle at 90% 10%, rgba(0,217,163,0.05), transparent 40%),
  var(--bg);
}
#app{max-width:640px;margin:0 auto;min-height:100vh;position:relative;}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:0.3px;}
.mono{font-family:var(--font-mono);}
button{font-family:var(--font-body);cursor:pointer;border:none;}
.hairline{height:1px;background:var(--line);border:none;margin:0;}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:rgba(10,13,17,0.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;}
.topbar .brand{display:flex;align-items:center;gap:9px;}
.chip-dot{width:12px;height:12px;border-radius:3px;flex:none;}
.topbar .team-name{font-family:var(--font-display);font-weight:700;font-size:15px;}
.topbar .sub{font-size:10px;color:var(--muted);font-family:var(--font-mono);letter-spacing:0.5px;}
.topbar .budget{font-family:var(--font-mono);font-weight:700;font-size:15px;color:var(--green);}
.topbar .budget-label{font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.stat-chips{display:flex;gap:8px;align-items:stretch;}
.stat-chip{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding:5px 10px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);min-width:58px;}
.stat-chip .chip-label{font-size:8px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:1px;}
.stat-chip .chip-value{font-family:var(--font-mono);font-weight:700;font-size:14px;line-height:1.1;display:flex;align-items:center;gap:3px;}
.stat-chip.budget-chip .chip-value{color:var(--green);}
.stat-chip.pos-chip{border-color:var(--line);}
.stat-chip.pos-chip.tier-gold{border-color:rgba(255,182,39,0.5);background:rgba(255,182,39,0.08);}
.stat-chip.pos-chip.tier-gold .chip-value{color:var(--amber);}
.stat-chip.pos-chip.tier-mid .chip-value{color:var(--green);}
.stat-chip.pos-chip.tier-low .chip-value{color:var(--muted);}

/* ---------- Bottom nav ---------- */
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(10,13,17,0.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;max-width:640px;margin:0 auto;}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;background:none;color:var(--muted);font-size:10px;font-family:var(--font-display);font-weight:600;letter-spacing:0.5px;text-transform:uppercase;position:relative;}
.navbtn.active{color:var(--text);}
.navbtn.active::before{content:'';position:absolute;top:0;left:20%;right:20%;height:2px;background:var(--red);}
.navbtn svg{width:20px;height:20px;stroke:currentColor;}
.navbtn .icon-wrap{position:relative;display:inline-flex;}
.nav-badge{position:absolute;top:-3px;right:-5px;width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px var(--bg);}

.view{padding:16px 16px 24px;animation:fadein 0.25s ease;}
.view.view-center{min-height:calc(100dvh - 150px);display:flex;flex-direction:column;justify-content:center;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;}
.card-title{font-family:var(--font-display);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
.eyebrow{font-family:var(--font-mono);font-size:10px;color:var(--red);letter-spacing:1.5px;text-transform:uppercase;font-weight:700;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:8px;font-weight:700;font-family:var(--font-display);font-size:13px;letter-spacing:0.6px;text-transform:uppercase;width:100%;transition:transform .1s;}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--red);color:#fff;}
.btn-primary:disabled{background:var(--surface3);color:var(--muted2);}
.btn-outline{background:transparent;border:1px solid var(--line);color:var(--text);}
.btn-ghost{background:var(--surface2);color:var(--text);}
.btn-sm{width:auto;padding:8px 12px;font-size:11px;}

/* ---------- Stat bars ---------- */
.statrow{margin-bottom:12px;}
.statrow .head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;}
.statrow .head .name{font-weight:600;}
.statrow .head .lvl{font-family:var(--font-mono);color:var(--muted);}
.bar{height:8px;background:var(--surface3);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;}
.bar-fill.aero{background:linear-gradient(90deg,#00D9A3,#00a37a);}
.bar-fill.power{background:linear-gradient(90deg,#E10600,#a30400);}
.bar-fill.chassis{background:linear-gradient(90deg,#FFB627,#c98600);}
.bar-fill.reliability{background:linear-gradient(90deg,#5B8DEF,#3a63b8);}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pill{display:inline-block;padding:3px 8px;border-radius:20px;font-size:10px;font-family:var(--font-mono);background:var(--surface3);color:var(--muted);}
.pill.on{background:rgba(0,217,163,0.15);color:var(--green);}
.pill.warn{background:rgba(255,182,39,0.15);color:var(--amber);}

/* driver card */
.driver-card{display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
.driver-card.selected{border-color:var(--red);background:rgba(225,6,0,0.07);}
.driver-avatar{width:38px;height:38px;border-radius:8px;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;}
.driver-info{flex:1;min-width:0;}
.driver-name{font-weight:700;font-size:13px;}
.driver-meta{font-size:10px;color:var(--muted);font-family:var(--font-mono);}
.driver-cost{font-family:var(--font-mono);font-weight:700;color:var(--amber);font-size:13px;}

/* strategy selector */
.strategy-opt{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--surface2);}
.strategy-opt.active{border-color:var(--green);background:rgba(0,217,163,0.08);}
.strategy-opt .lbl{font-weight:700;font-size:12px;}
.strategy-opt .desc{font-size:10px;color:var(--muted);}

/* results table */
.res-row{display:grid;grid-template-columns:28px 1fr 50px 42px;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line);font-size:12px;}
.res-row.you{background:rgba(225,6,0,0.08);border-radius:6px;}
.res-row .pos{font-family:var(--font-mono);color:var(--muted);font-weight:700;}
.res-row .pts{font-family:var(--font-mono);color:var(--green);text-align:right;font-weight:700;}
.res-row .team{color:var(--muted2);font-size:9px;}
.res-row .dnf{color:var(--red);font-family:var(--font-mono);font-size:10px;}

.track-banner{background:linear-gradient(135deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:10px;padding:18px;text-align:center;margin-bottom:14px;position:relative;overflow:hidden;}
.track-banner::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:repeating-linear-gradient(90deg,#fff 0 10px,transparent 10px 20px);opacity:0.15;}
.round-num{font-family:var(--font-mono);color:var(--red);font-size:11px;letter-spacing:2px;}
.track-name{font-size:22px;margin-top:4px;}

input[type=text],input[type=color]{background:var(--surface2);border:1px solid var(--line);color:var(--text);padding:12px;border-radius:8px;font-family:var(--font-body);font-size:14px;width:100%;}
.color-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.color-swatch{width:32px;height:32px;border-radius:8px;border:2px solid transparent;flex:none;}
.color-swatch.active{border-color:#fff;}
.empty-state{text-align:center;padding:30px 10px;color:var(--muted);}
.tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--surface2);padding:4px;border-radius:8px;}
.tab{flex:1;text-align:center;padding:8px;border-radius:6px;font-size:11px;font-weight:700;font-family:var(--font-display);letter-spacing:0.5px;text-transform:uppercase;color:var(--muted);background:none;}
.tab.active{background:var(--red);color:#fff;}
.standing-row{display:grid;grid-template-columns:26px 1fr 40px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:12px;align-items:center;}
.standing-row.you{background:rgba(225,6,0,0.08);border-radius:6px;font-weight:700;}
.standing-row .p{font-family:var(--font-mono);color:var(--muted);}
.standing-row .pt{font-family:var(--font-mono);text-align:right;color:var(--green);font-weight:700;}
.sponsor-card{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;}
.sponsor-top{display:flex;justify-content:space-between;align-items:flex-start;}
.sponsor-name{font-weight:700;font-size:13px;}
.sponsor-value{font-family:var(--font-mono);color:var(--green);font-weight:700;font-size:14px;}
.progress-track{height:5px;background:var(--surface3);border-radius:3px;margin-top:8px;overflow:hidden;}
.progress-fill{height:100%;background:var(--amber);}
.notice{background:var(--surface2);border-left:3px solid var(--amber);padding:10px 12px;border-radius:0 6px 6px 0;font-size:12px;color:var(--muted);margin-bottom:14px;}
.season-badge{font-family:var(--font-mono);font-size:10px;color:var(--muted);letter-spacing:1px;}
.career-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px;}
.career-row .szn{font-weight:700;}
.big-num{font-family:var(--font-mono);font-size:28px;font-weight:700;}
.modal-overlay{position:fixed;inset:0;background:rgba(6,8,10,0.75);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;}
.modal-box{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:400px;width:100%;}
.modal-box h3{font-size:16px;margin-bottom:10px;}
.modal-box p{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:18px;}
.modal-actions{display:flex;gap:10px;}
.field-error{color:var(--red);font-size:12px;margin-top:8px;font-family:var(--font-mono);}
@keyframes brakemove { from{left:0%;} to{left:calc(100% - 34px);} }
.brake-track{position:relative;height:64px;background:linear-gradient(90deg,var(--surface3),var(--surface3) 85%,rgba(225,6,0,0.12));border-radius:8px;overflow:hidden;margin-bottom:16px;}
.brake-zone{position:absolute;top:0;bottom:0;background:rgba(0,217,163,0.3);border-left:2px dashed var(--green);border-right:2px dashed var(--green);}
.brake-car{position:absolute;top:14px;font-size:28px;line-height:1;}
.brake-corner{position:absolute;right:6px;top:0;bottom:0;display:flex;align-items:center;font-size:22px;}
.tire-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:6px 0;}
.tire-chip{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-family:var(--font-display);font-size:17px;border:3px solid transparent;cursor:pointer;position:relative;transition:transform .12s;}
.tire-chip.active{border-color:var(--text);transform:scale(1.1);}
.tire-chip .badge{position:absolute;bottom:-3px;right:-3px;width:16px;height:16px;border-radius:50%;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid var(--surface);}
.tire-chip .badge.ok{background:var(--green);color:#04241c;}
.tire-chip .badge.warn{background:var(--red);color:#fff;}
.tire-caption{text-align:center;margin-top:8px;font-size:11px;font-weight:600;}
.rivalry-vs{display:flex;align-items:stretch;gap:8px;margin-top:4px;}
.rivalry-driver{flex:1;text-align:center;padding:14px 8px 12px;border-radius:10px;background:var(--surface2);border:2px solid var(--line);position:relative;transition:border-color .15s,background .15s;}
.rivalry-driver.leader{border-color:var(--amber);background:rgba(255,182,39,0.08);}
.rivalry-driver .crown-slot{height:18px;margin-bottom:2px;font-size:15px;}
.rivalry-driver .rv-avatar{font-size:26px;line-height:1;margin-bottom:6px;}
.rivalry-driver .rv-name{font-weight:700;font-size:12.5px;line-height:1.25;min-height:30px;display:flex;align-items:center;justify-content:center;}
.rivalry-driver .rv-pts{font-family:var(--font-mono);color:var(--green);font-weight:700;font-size:15px;margin-top:6px;}
.rivalry-driver .rv-h2h{font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:0.3px;}
.rivalry-driver .rv-tap{font-size:9px;color:var(--muted2);margin-top:8px;text-transform:uppercase;letter-spacing:0.5px;}
.rivalry-vs-badge{flex:none;align-self:center;font-family:var(--font-display);font-weight:900;font-size:13px;color:var(--red);background:var(--surface3);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);}
.dominance-track{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:14px;background:var(--surface3);}
.dominance-seg{height:100%;transition:width .2s;}
.dominance-caption{display:flex;justify-content:space-between;font-size:9px;color:var(--muted2);font-family:var(--font-mono);margin-top:4px;}
.tension-banner{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:11.5px;line-height:1.4;display:flex;align-items:flex-start;gap:8px;}
.tension-banner.hot{background:linear-gradient(90deg,rgba(225,6,0,0.16),rgba(255,182,39,0.08));border:1px solid rgba(225,6,0,0.4);}
.tension-banner.calm{background:var(--surface2);border:1px solid var(--line);color:var(--muted);}
.tension-banner.hype{background:rgba(255,182,39,0.1);border:1px solid rgba(255,182,39,0.4);}
.start-lights{display:flex;justify-content:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.start-light{width:38px;height:38px;border-radius:50%;background:var(--surface3);border:2px solid var(--line);transition:background 0.08s, box-shadow 0.08s;}
.start-light.on{background:var(--red);border-color:var(--red);box-shadow:0 0 14px rgba(225,6,0,0.75);}
.power-row{display:flex;align-items:center;gap:10px;padding:7px 0;}
.power-row .prk{width:18px;font-family:var(--font-mono);font-size:11px;color:var(--muted);flex:none;}
.power-row .pname{width:112px;flex:none;font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.power-row.you .pname{color:var(--red);}
.power-bar-track{flex:1;height:14px;background:var(--surface3);border-radius:4px;overflow:hidden;}
.power-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#5B8DEF,#00D9A3);}
.power-row.you .power-bar-fill{background:linear-gradient(90deg,var(--red),#ff6b35);}
.power-row .pval{width:38px;flex:none;text-align:right;font-family:var(--font-mono);font-size:11px;color:var(--text);}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =============================== DATA =============================== */
const STARTING_BUDGET = 150;
const TEAM_COLORS = ['#E10600','#00D9A3','#5B8DEF','#FFB627','#B84AE1','#FF6B35','#2ECC71','#F1C40F'];

const DRIVERS = [

   additional entry alongside them. Team "rating" reflects car competitiveness;
   driver rating reflects car+driver combined skill used in the race sim.
   Values are stylised approximations for gameplay balance, not official data. */
const REAL_TEAMS = [

 {name:'Alpine', rating:77, drivers:[{name:'Pierre Gasly',rating:89},{name:'Franco Colapinto',rating:76}]},
 {name:'Audi', rating:76, drivers:[{name:'Nico Hülkenberg',rating:84},{name:'Gabriel Bortoleto',rating:78}]},
 {name:'Cadillac', rating:72, drivers:[{name:'Sergio Pérez',rating:79},{name:'Valtteri Bottas',rating:81}]},

/* Real confirmed 2026 reserve/test drivers per team (in priority order).
   Used to fill a seat when the player signs away that team's race driver,
   instead of an obviously fake "Reserve" placeholder. If a name is already
   taken (e.g. Yuki Tsunoda covers both Red Bull and Racing Bulls), the next
   candidate on the list is used. */
const REAL_RESERVES = {
 'McLaren':['Pato O\u2019Ward','Leonardo Fornaroli'],
 'Mercedes':['Frederik Vesti'],

 'Cadillac':['Zhou Guanyu'],

/* Weather: rolled independently for qualifying and for the race itself (real
   F1 sessions often see different conditions). Each condition has a matching
   tire category; using the wrong category is a serious mistake. */
const WEATHERS = [
 {id:'clear',     label:'Sereno',          icon:'☀️', tireCategory:'slick',        stress:0,   weight:5},
 {id:'cloudy',    label:'Nuvoloso',        icon:'☁️', tireCategory:'slick',        stress:0.3, weight:3},

];
function pickWeather(){
  const totalWeight = WEATHERS.reduce((s,w)=>s+w.weight,0);
  let roll = Math.random()*totalWeight;
  for(const w of WEATHERS){ if(roll < w.weight) return w.id; roll -= w.weight; }
  return WEATHERS[0].id;
}

];
// Using the wrong tire category for the conditions is a serious mistake
// (slicks in the wet, wets on a dry track): big pace loss, much higher risk.
function tireEffect(tireId, weatherId){
  const tire = TIRES.find(t=>t.id===tireId) || TIRES.find(t=>t.id==='medium');
  const weather = WEATHERS.find(w=>w.id===weatherId) || WEATHERS[0];
  if(tire.category !== weather.tireCategory){
    return { paceMod:-12, dnfMod:6, mismatch:true };
  }
  return { paceMod:tire.pace, dnfMod:tire.dnf, mismatch:false };
}
function tiresForWeather(weatherId){
  const weather = WEATHERS.find(w=>w.id===weatherId) || WEATHERS[0];
  return TIRES.filter(t=>t.category===weather.tireCategory);
}

function migrateState(){
  if(!state) return;
  const realNames = REAL_TEAMS.map(t=>t.name);
  const hasStaleTeams = (state.aiTeams||[]).some(t=>!realNames.includes(t.name));
  if(hasStaleTeams){
    // old save from before the real-grid update: rebuild AI teams and constructor standings
    state.aiTeams = [];
    const cleaned = {};
    Object.entries(state.standingsConstructors||{}).forEach(([k,v])=>{
      if(k==='YOU' || realNames.includes(k)) cleaned[k]=v;
    });
    state.standingsConstructors = cleaned;
    if(state.phase==='season' || state.phase==='seasonend'){ ensureAiTeams(); }
  }
  // older saves may be missing the 'power' field used for the overall power ranking chart
  (state.aiTeams||[]).forEach(t=>{ if(typeof t.power !== 'number'){ t.power = t.rating; } });
  if(state.confirmingReset === undefined) state.confirmingReset = false;
  if(state.formError === undefined) state.formError = '';
  if(state.difficulty === undefined) state.difficulty = 'hard'; // older saves always started at minimum power
  if(state.previousDrivers === undefined) state.previousDrivers = [...state.drivers];
  if(state.qualiGrid === undefined) state.qualiGrid = {};
  if(state.qualiResults === undefined) state.qualiResults = null;

  if(state.skillBonusRace === undefined) state.skillBonusRace = 0;
  if(state.leadDriverId === undefined) state.leadDriverId = null;
  if(state.rivalry === undefined || !state.rivalry.headToHead){ state.rivalry = {headToHead:{}}; }
  state.drivers.forEach(id=>{ if(state.rivalry.headToHead[id] === undefined) state.rivalry.headToHead[id] = 0; });

  // its existing stage rather than being forced back into a quali session

  if(state.raceStartIndex === undefined) state.raceStartIndex = 0;
  if(state.raceStartResults === undefined) state.raceStartResults = {};
  if(state.lastSponsorBonus === undefined) state.lastSponsorBonus = null;

/* =============================== HELPERS =============================== */
function fmtM(n){ return '$'+ (Math.round(n*10)/10).toFixed(1) + 'M'; }
function driverById(id){ return DRIVERS.find(d=>d.id===id) || (state && state.customDrivers && state.customDrivers[id]); }
function myDrivers(){ return state.drivers.map(driverById); }

function upgradeCost(stat, level){
  const base = STAT_META[stat].base;
  return Math.round(base * Math.pow(level,1.7) * 10)/10;
}

// Every driver overall rating chips in a small automatic development gain each
// race weekend (better drivers give better feedback/data), on top of anything
// you pay for in the Garage. Applies evenly across all 4 car areas.
function driverDevelopmentGain(){
  const ds = myDrivers().filter(Boolean);
  if(!ds.length) return 0;
  const avgRating = ds.reduce((sum,d)=>sum+d.rating,0) / ds.length;
  return Math.max(0, (avgRating - 60)) / 60 * 0.3;
}
function applyDriverDevelopmentGain(){
  const gain = driverDevelopmentGain();
  if(gain<=0) return;
  ['aero','power','chassis','reliability'].forEach(k=>{ state.car[k] += gain; });
}

function carRatingFor(track){
  const c = state.car;
  const raw = c.aero*track.w.aero + c.power*track.w.power + c.chassis*track.w.chassis;
  return raw * 9; // scale so level~10 across the board ~ 90
}

function teamPointsSoFar(name){ return state.standingsConstructors[name] || 0; }
function myConstructorPosition(){
  const arr = Object.entries(state.standingsConstructors).sort((a,b)=>b[1]-a[1]);
  const idx = arr.findIndex(e=>e[0]==='YOU');
  return idx===-1 ? arr.length+1 : idx+1;
}

// The name shown everywhere in the UI: base team name, with the title
// investor's name bolted on the front for as long as that deal runs.
function displayTeamName(){
  const base = state.team.name || 'La tua Scuderia';
  return state.titleInvestor ? `${state.titleInvestor.name} ${base}` : base;
}

/* =============================== BANK LOAN =============================== */
function applyLoanRepayment(){
  if(!state.loan) return;
  const pay = Math.min(state.loan.installmentAmount, state.loan.remainingOwed);
  state.budget -= pay;
  state.loan.remainingOwed = Math.round((state.loan.remainingOwed - pay)*100)/100;
  state.loan.remainingInstallments -= 1;
  if(state.loan.remainingOwed<=0 || state.loan.remainingInstallments<=0){
    state.loan = null;
  }
}

/* =============================== TITLE INVESTORS =============================== */
function refreshInvestorOffers(){
  const pos = state.phase==='season' ? myConstructorPosition() : 6;
  const totalTeams = (state.aiTeams.length||11) + 1;
  const mult = pos<=Math.ceil(totalTeams*0.25) ? 1.4 : (pos<=Math.ceil(totalTeams*0.6) ? 1.0 : 0.7);
  const shuffled = [...INVESTOR_POOL].sort(()=>Math.random()-0.5).slice(0,3);
  state.investorOffers = shuffled.map(inv=>({
    id:inv.id, name:inv.name,
    amount: Math.round(inv.base*mult*(0.85+Math.random()*0.3)*10)/10
  }));
}

/* =============================== MID-SEASON DRIVER MARKET =============================== */
// Every real driver either races for a real team or is one of your two. Once
// the season's AI rosters are locked in, the only people left to sign are the
// handful of confirmed 2026 reserve/test drivers whose seat hasn't already
// been activated by someone else poaching their team-mate.
function reserveDescriptorByName(name){
  for(const t of REAL_TEAMS){
    const list = REAL_RESERVES[t.name] || [];
    if(list.includes(name)){
      const rating = Math.round(Math.max(58, t.rating - 12));
      const cost = Math.max(4, Math.round(rating*0.22));
      return { name, nat:'🏳️', rating, cost, tag:'Riserva '+t.name };
    }
  }
  return null;
}
function slugifyReserveName(name){
  return 'res_' + name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
}
function midSeasonMarketPool(excludeDriverId){
  const usedNames = new Set();
  state.aiTeams.forEach(t=>t.drivers.forEach(d=>usedNames.add(d.name)));
  state.drivers.forEach(id=>{
    if(id===excludeDriverId) return;
    const d = driverById(id);
    if(d) usedNames.add(d.name);
  });
  const fromMainPool = DRIVERS.filter(d=>!usedNames.has(d.name)).map(d=>({key:d.id, name:d.name, nat:d.nat, rating:d.rating, cost:d.cost, tag:'Svincolato'}));
  const seen = new Set(fromMainPool.map(d=>d.name));
  const fromReserves = [];
  REAL_TEAMS.forEach(t=>{
    (REAL_RESERVES[t.name]||[]).forEach(name=>{
      if(usedNames.has(name) || seen.has(name)) return;
      seen.add(name);
      const desc = reserveDescriptorByName(name);
      if(desc) fromReserves.push({key:name, ...desc});
    });
  });
  return [...fromMainPool, ...fromReserves].sort((a,b)=>b.rating-a.rating);
}

// Can you actually afford to replace this driver if you let them go?
function canAffordReplacementFor(driverId){
  const pool = midSeasonMarketPool(driverId);
  return pool.some(c=>c.cost <= state.budget);
}

function ensureAiTeams(){
  if(state.aiTeams && state.aiTeams.length){ initAiDriverStandings(); return; }
  const myNames = myDrivers().map(d=>d && d.name).filter(Boolean);
  const usedNames = new Set(myNames); // names already spoken for, so no driver appears twice on the grid
  // small season-to-season wobble so standings aren't 100% static across career
  state.aiTeams = REAL_TEAMS.map(t=>({
    name:t.name,
    rating: t.rating,
    power: t.rating, // evolves race-by-race as rival teams develop their car
    drivers: t.drivers.map(d=>{
      if(myNames.includes(d.name)){
        // this driver was signed away by the player's team: the real team calls up its actual 2026 reserve driver
        const candidates = REAL_RESERVES[t.name] || [];
        const pick = candidates.find(name=>!usedNames.has(name));
        const chosenName = pick || (t.name+' Reserve');
        usedNames.add(chosenName);
        return {name:chosenName, rating: Math.max(58, t.rating - 12)};
      }
      usedNames.add(d.name);
      return {name:d.name, rating: Math.max(60, Math.min(99, d.rating + (Math.random()*4-2)))};
    })
  }));
  state.aiTeams.forEach(t=>{ if(!(t.name in state.standingsConstructors)) state.standingsConstructors[t.name]=0; });
  initAiDriverStandings();
}

// Makes sure every AI driver has a (possibly zero) entry in the driver standings,
// so the Standings > Piloti tab always lists the full grid, not just your own 2 drivers.
function initAiDriverStandings(){
  state.aiTeams.forEach(t=>{
    t.drivers.forEach(dr=>{
      if(state.standingsDrivers[dr.name] === undefined){ state.standingsDrivers[dr.name] = 0; }
    });
  });
}

// Player's overall car power on the same 0-100-ish scale as AI team power, so they can be ranked together.
function playerPower(){
  return ((state.car.aero + state.car.power + state.car.chassis) / 3) * 9;
}

// Advance rival development a little after every race weekend (mimics real-world in-season upgrades).
function advanceAiDevelopment(){
  const events = [];
  state.aiTeams.forEach(t=>{
    const before = t.power;
    const roll = Math.random();
    let step, type;
    if(roll < 0.12){
      // failed update: the upgrade doesn't work out, sometimes it's even a step backwards
      step = -0.35 + Math.random()*0.45;
      type = 'bad';
    } else if(roll < 0.85){
      // normal, steady development
      step = 0.15 + Math.random()*0.55;
      type = 'normal';
    } else {
      // breakthrough: a real technical leap that can flip the order of the grid
      step = 0.9 + Math.random()*1.4;
      type = 'breakthrough';
    }
    t.power = Math.max(50, Math.min(99, t.power + step));
    if(type!=='normal'){
      events.push({ team:t.name, delta:Math.round((t.power-before)*100)/100, type });
    }
  });
  state.lastDevelopmentEvents = events;
}

function overallPowerRanking(){
  const rows = state.aiTeams.map(t=>({ name:t.name, power:Math.round(t.power*10)/10, you:false }));
  rows.push({ name: displayTeamName(), power: Math.round(playerPower()*10)/10, you:true });
  return rows.sort((a,b)=>b.power-a.power);
}

function refreshSponsorOffers(){
  const pos = state.phase==='season' ? myConstructorPosition() : 6;
  const mult = pos<=3 ? 1.5 : (pos<=7 ? 1.0 : 0.65);
  const activeIds = state.activeSponsors.map(s=>s.id);
  const pool = SPONSOR_POOL.filter(s=>!activeIds.includes(s.id));
  const shuffled = [...pool].sort(()=>Math.random()-0.5).slice(0,MAX_SPONSOR_OFFERS);
  state.sponsorOffers = shuffled.map(s=>({
    id:s.id, name:s.name, industry:s.industry, duration:s.duration,
    value: Math.round(s.base*mult*(0.85+Math.random()*0.3)*10)/10
  }));
}

/* =============================== RACE SIMULATION =============================== */

// Builds the base list of every car on the grid (you + all real AI teams) with
// their car/driver rating for this track, shared by both qualifying and the race.
function raceEntrants(track){
  const list = [];
  myDrivers().forEach(d=>{
    list.push({team:'YOU', name:d.name, rating:d.rating, carScore:carRatingFor(track), driverId:d.id, key:d.id});
  });
  ensureAiTeams();
  state.aiTeams.forEach(t=>{
    t.drivers.forEach(dr=>{
      list.push({team:t.name, name:dr.name, rating:dr.rating, carScore:t.power, driverId:null, key:dr.name});
    });
  });
  return list;
}

// Qualifying: one clean, low-variance lap each. No strategy, no DNFs, just
// car + driver pace. Sets the grid order used by the race that follows.
function simulateQualifying(){
  const track = CALENDAR[state.raceIndex];
  const entrants = raceEntrants(track);
  const scored = entrants.map(e=>{
    const variance = (Math.random()*2-1) * 4; // tight, low-variance lap
    const skillBonus = e.team==='YOU' ? (state.skillBonusQuali||0) : 0;
    // AI teams always pick the sensible tire for conditions; only your choice can go wrong.
    const tireMod = e.team==='YOU'
      ? tireEffect(state.qualiTire, state.qualiWeather).paceMod
      : tireEffect((WEATHERS.find(w=>w.id===state.qualiWeather)?.tireCategory==='slick') ? 'medium' : (tiresForWeather(state.qualiWeather)[0]||TIRES[1]).id, state.qualiWeather).paceMod;
    const score = e.carScore*0.55 + e.rating*0.45 + variance + skillBonus + tireMod;
    return {...e, score};
  }).sort((a,b)=>b.score-a.score);

  const grid = {};
  const results = scored.map((e,i)=>{
    grid[e.key] = i+1;
    return {team:e.team, name:e.name, key:e.key, pos:i+1};
  });
  state.qualiGrid = grid;
  state.qualiResults = results;
  return results;
}

function raceStartBonus(driverId){
  const rs = state.raceStartResults[driverId];
  if(!rs) return 0;
  switch(rs.type){
    case 'jumpstart': return -6;   // false start: time penalty served during the race
    case 'perfect':   return 1.5;  // reaction under 200ms: gets the jump on the field
    case 'good':      return 0;    // solid, unremarkable start
    case 'slow':      return -2;   // sluggish reaction, loses a little ground off the line
    case 'verySlow':  return -4;   // very slow reaction, loses more ground
    default:          return 0;
  }
}

function simulateRace(){
  const track = CALENDAR[state.raceIndex];
  const entries = [];
  const gridSize = raceEntrants(track).length;
  // my two drivers
  myDrivers().forEach(d=>{
    const strat = STRATEGIES[state.strategies[d.id] || 'balanced'];
    const leaderBonus = (state.leadDriverId===d.id) ? 2.5 : 0;
    const startBonus = raceStartBonus(d.id);
    const tire = tireEffect(state.raceTires[d.id] || 'medium', state.raceWeather);
    entries.push(buildEntry('YOU', d.name, d.rating, carRatingFor(track), strat, track, d.id, d.id, gridSize, leaderBonus + startBonus + tire.paceMod, tire.dnfMod));
  });
  // AI teams (real 2026 grid constructors)
  ensureAiTeams();
  state.aiTeams.forEach(t=>{
    const aiCarBase = t.power;
    t.drivers.forEach(dr=>{
      const strat = STRATEGIES.balanced;
      entries.push(buildEntry(t.name, dr.name, dr.rating, aiCarBase, strat, track, null, dr.name, gridSize));
    });
  });

  // sort finishers by score, DNFs go last
  const finishers = entries.filter(e=>!e.dnf).sort((a,b)=>b.score-a.score);
  const dnfs = entries.filter(e=>e.dnf);
  const ordered = [...finishers, ...dnfs];

  // fastest lap bonus: random among top 10 finishers weighted by score
  let flIdx = -1;
  if(finishers.length){
    const top10 = finishers.slice(0,10);
    flIdx = entries.indexOf(top10[Math.floor(Math.random()*Math.min(3,top10.length))]);
  }

  const results = ordered.map((e,i)=>{
    const pos = i+1;
    let pts = (!e.dnf && pos<=10) ? POINTS[pos-1] : 0;
    if(entries.indexOf(e)===flIdx && !e.dnf && pos<=10) pts += 1;
    const startPos = state.qualiGrid[e.key] || null;
    const startReaction = (e.team==='YOU' && e.driverId) ? state.raceStartResults[e.driverId] : null;
    return {...e, pos, pts, startPos, startReaction};
  });

  // update standings
  results.forEach(r=>{
    if(r.key){ state.standingsDrivers[r.key] = (state.standingsDrivers[r.key]||0) + r.pts; }
    state.standingsConstructors[r.team] = (state.standingsConstructors[r.team]||0) + r.pts;
  });

  // head-to-head: only counted when BOTH your drivers actually finish the race
  const mine = results.filter(r=>r.team==='YOU');
  if(mine.length===2 && !mine[0].dnf && !mine[1].dnf){
    const winner = mine[0].pos < mine[1].pos ? mine[0] : mine[1];
    state.rivalry.headToHead[winner.key] = (state.rivalry.headToHead[winner.key]||0) + 1;
  }

  state.lastResults = results;
  return results;
}

function buildEntry(team, name, rating, carScore, strat, track, driverId, key, gridSize, leaderBonus, tireDnfMod){
  const reliabilityLevel = driverId ? state.car.reliability : (6 + state.season*0.5);
  const baseDnf = Math.max(0.5, (11-reliabilityLevel)*0.9);
  const dnfChance = Math.max(0.3, baseDnf + track.stress + strat.dnf + (tireDnfMod||0));
  const dnf = (Math.random()*100) < dnfChance;
  const variance = (Math.random()*2-1) * strat.variance;
  // starting further up the grid gives a real (but not decisive) race-pace edge:
  // clean air, track position, fewer cars to fight through.
  const gridPos = state.qualiGrid ? state.qualiGrid[key] : null;
  const gridBonus = gridPos ? (gridSize - gridPos) * 0.35 : 0;
  const skillBonus = team==='YOU' ? (state.skillBonusRace||0) : 0;
  const score = carScore*0.55 + rating*0.45 + strat.pace + variance + gridBonus + skillBonus + (leaderBonus||0);
  return {team, name, rating, score, dnf, driverId, key};
}

/* =============================== SEASON / SPONSOR PAYOUT =============================== */
// Determines this race's sponsor bonus tier from the player's own results.
// Bonuses are expressed as a multiplier of each sponsor's base per-race value,
// so a richer sponsor also pays a richer bonus.
function sponsorBonusInfo(){
  const mine = (state.lastResults||[]).filter(r=>r.team==='YOU' && !r.dnf);
  const positions = mine.map(r=>r.pos).sort((a,b)=>a-b);
  let tierMultiplier = 0, tierLabel = null;
  if(positions.length===2 && positions[0]===1 && positions[1]===2){
    tierMultiplier = 1.0; tierLabel = '🥇🥈 Doppietta 1-2!';
  } else if(positions.includes(1)){
    tierMultiplier = 0.6; tierLabel = '🏆 Vittoria di gara!';
  } else if(positions.length===2 && positions[0]<=3 && positions[1]<=3){
    tierMultiplier = 0.5; tierLabel = '🏅 Doppio podio!';
  } else if(positions.some(p=>p<=3)){
    tierMultiplier = 0.3; tierLabel = '🏁 Podio!';
  }
  const hasPole = state.drivers.some(id=>state.qualiGrid[id]===1);
  const poleMultiplier = hasPole ? 0.15 : 0;
  return { tierMultiplier, tierLabel, poleMultiplier, hasPole };
}

function applyRacePayouts(){
  const info = sponsorBonusInfo();
  const totalMultiplier = info.tierMultiplier + info.poleMultiplier;
  let totalBonus = 0;
  state.activeSponsors.forEach(s=>{
    const bonus = Math.round(s.value * totalMultiplier * 10)/10;
    state.budget += s.value + bonus;
    totalBonus += bonus;
    s.remaining -= 1;
  });
  state.activeSponsors = state.activeSponsors.filter(s=>s.remaining>0);
  state.lastSponsorBonus = (totalBonus>0) ? { amount: Math.round(totalBonus*10)/10, label: info.tierLabel, hasPole: info.hasPole } : null;
}

function endSeason(){
  const pos = myConstructorPosition();
  const prize = Math.max(25, 100 - (pos-1)*8);
  state.budget += prize;
  // Garage development is now permanent: no year-over-year reset or decay.
  // Whatever you've built stays built, season after season.
  // Consider EVERY driver who drove for the team this season, not just the
  // final 2-driver lineup: a rescinded mid-season driver may well have been
  // the team's top scorer and should still show up in the recap.
  const seasonRoster = Array.from(new Set([...(state.seasonDriverIds||[]), ...state.drivers]));
  const bestDriver = [...seasonRoster].sort((a,b)=>(state.standingsDrivers[b]||0)-(state.standingsDrivers[a]||0))[0];
  state.seasonHistory.push({
    season: state.season,
    teamPos: pos,
    teamPoints: Math.round(teamPointsSoFar('YOU')),
    prize,
    bestDriver: bestDriver ? (driverById(bestDriver) ? driverById(bestDriver).name : bestDriver) : '-',
    bestDriverPts: bestDriver ? (state.standingsDrivers[bestDriver]||0) : 0,
    rosterChanges: (state.seasonRosterEvents||[]).filter(e=>e.inId), // only completed swaps
  });
  state.season += 1;
  state.raceIndex = 0;
  state.standingsDrivers = {};
  state.standingsConstructors = {};
  state.activeSponsors = [];
  // Naming-rights deals only cover the season they were signed in; the team
  // name reverts to normal unless a new investor is found next season.
  state.titleInvestor = null;
  state.investorOffers = [];
  // Any loan not paid off carries into the new season with a rollover penalty:
  // the remaining balance grows a bit and the term resets around what's left.
  if(state.loan){
    state.loan.remainingOwed = Math.round(state.loan.remainingOwed*1.1*10)/10;
    state.loan.totalOwed = state.loan.remainingOwed;
    state.loan.remainingInstallments = Math.max(state.loan.remainingInstallments, 4);
    state.loan.installmentAmount = Math.round((state.loan.remainingOwed/state.loan.remainingInstallments)*10)/10;
  }
  // Drivers already under contract are kept selected by default; the player
  // can swap either seat before the new season's AI rosters are finalised.
  state.previousDrivers = [...state.drivers];
  state.aiTeams = [];
  state.formError = '';
  state.phase = 'redraft';
}

/* =============================== ACTIONS =============================== */
const Actions = {
  async init(){ await loadState(); },
  setTeamName(v){ state.team.name = v; },
  setTeamColor(c){ update(s=>{ s.team.color = c; }); },
  setDifficulty(key){
    update(s=>{
      s.difficulty = key;
      s.car = {...DIFFICULTY_CAR_LEVELS[key]};
    });
  },
  confirmSetup(){
    if(!state.team.name || !state.team.name.trim()){ updateUI(s=>{ s.formError='Inserisci un nome per la scuderia.'; }); return; }
    update(s=>{ s.phase='draft'; s.formError=''; });
  },
  toggleDriver(id){
    update(s=>{
      const idx = s.drivers.indexOf(id);
      if(idx>-1){ s.drivers.splice(idx,1); return; }
      if(s.drivers.length>=2){ return; }
      const cost = driverById(id).cost;
      if(cost > s.budget){ return; }
      s.drivers.push(id);
    });
  },
  confirmDraft(){
    if(state.drivers.length!==2){ updateUI(s=>{ s.formError='Seleziona esattamente 2 piloti.'; }); return; }
    update(s=>{
      const total = s.drivers.reduce((sum,id)=>sum+driverById(id).cost,0);
      s.budget -= total;
      s.drivers.forEach(id=>{ s.strategies[id]='balanced'; s.standingsDrivers[id]=0; });
      s.standingsConstructors['YOU']=0;
      s.leadDriverId = null;
      s.rivalry = {headToHead:{}};
      s.drivers.forEach(id=>{ s.rivalry.headToHead[id]=0; });
      s.qualiWeather = pickWeather();
      s.raceWeather = pickWeather();
      s.qualiTire = 'medium';
      s.raceTires = {};
      s.drivers.forEach(id=>{ s.raceTires[id] = 'medium'; });
      s.formError='';
      s.seasonDriverIds = [...s.drivers];
      s.seasonRosterEvents = [];
      ensureAiTeams();
      refreshSponsorOffers();
      s.phase='season';
      s.activeTab='home';
    });
  },
  setTab(tab){ update(s=>{ s.activeTab=tab; }); },
  upgrade(stat){
    update(s=>{
      const cost = upgradeCost(stat, Math.floor(s.car[stat]));
      if(cost > s.budget) return;
      s.budget -= cost;
      s.car[stat] += 1;
    });
  },
  signSponsor(id){
    update(s=>{
      if(s.activeSponsors.length>=MAX_ACTIVE_SPONSORS) return;
      const offer = s.sponsorOffers.find(o=>o.id===id);
      if(!offer) return;
      s.activeSponsors.push({id:offer.id,name:offer.name,value:offer.value,remaining:offer.duration,duration:offer.duration});
      s.sponsorOffers = s.sponsorOffers.filter(o=>o.id!==id);
    });
  },
  refreshOffers(){ update(s=>{ refreshSponsorOffers(); }); },
  requestLoan(tierId){
    update(s=>{
      if(s.loan) return; // must repay the current loan first
      const tier = LOAN_TIERS.find(t=>t.id===tierId);
      if(!tier) return;
      const totalOwed = Math.round(tier.amount*(1+tier.rate)*10)/10;
      const installmentAmount = Math.round((totalOwed/tier.term)*10)/10;
      s.budget += tier.amount;
      s.loan = { tierId, principal:tier.amount, totalOwed, remainingOwed:totalOwed, remainingInstallments:tier.term, installmentAmount };
    });
  },
  refreshInvestorOffers(){ update(s=>{ refreshInvestorOffers(); }); },
  acceptInvestor(offerId){
    update(s=>{
      if(s.titleInvestor) return; // one naming deal at a time
      const offer = s.investorOffers.find(o=>o.id===offerId);
      if(!offer) return;
      s.budget += offer.amount;
      s.titleInvestor = { name: offer.name };
      s.investorOffers = [];
    });
  },
  setStrategy(driverId, strat){
    update(s=>{ s.strategies[driverId] = strat; });
  },
  setQualiTire(tireId){
    update(s=>{ s.qualiTire = tireId; });
  },
  setRaceTire(driverId, tireId){
    update(s=>{ s.raceTires[driverId] = tireId; });
  },
  setLeadDriver(driverId){
    update(s=>{ s.leadDriverId = (s.leadDriverId===driverId) ? null : driverId; });
  },
  requestRescind(driverId){
    if(!canAffordReplacementFor(driverId)){
      updateUI(s=>{ s.formError = 'Budget insufficiente per ingaggiare un sostituto: non puoi rescindere questo contratto ora.'; });
      return;
    }
    updateUI(s=>{ s.pendingRescindDriverId = driverId; s.formError=''; });
  },
  cancelRescind(){
    updateUI(s=>{ s.pendingRescindDriverId = null; });
  },
  confirmRescind(){
    update(s=>{
      const id = s.pendingRescindDriverId;
      if(!id) return;
      if(!canAffordReplacementFor(id)){ s.pendingRescindDriverId = null; s.formError = 'Budget insufficiente per ingaggiare un sostituto: non puoi rescindere questo contratto ora.'; return; }
      const outName = driverById(id) ? driverById(id).name : id;
      const outPts = s.standingsDrivers[id]||0;
      s.drivers = s.drivers.filter(x=>x!==id);
      if(s.leadDriverId===id){ s.leadDriverId = null; }
      delete s.strategies[id];
      s.pendingRescindDriverId = null;
      // record the swap so the season-end recap and career history can show
      // who was let go and who replaced them; inId/inName filled in once the
      // replacement is actually signed via signMarketDriver.
      s.seasonRosterEvents.push({ raceIndex:s.raceIndex, outId:id, outName, outPts, inId:null, inName:null });
    });
  },
  signMarketDriver(key){
    update(s=>{
      if(s.drivers.length>=2) return;
      const openEvent = [...s.seasonRosterEvents].reverse().find(e=>e.inId===null);
      const existing = driverById(key);
      if(existing){
        if(existing.cost > s.budget) return;
        s.budget -= existing.cost;
        s.drivers.push(key);
        s.strategies[key] = 'balanced';
        if(s.standingsDrivers[key]===undefined) s.standingsDrivers[key]=0;
        if(s.rivalry.headToHead[key]===undefined) s.rivalry.headToHead[key]=0;
        if(s.raceTires[key]===undefined) s.raceTires[key]='medium';
        if(!s.seasonDriverIds.includes(key)) s.seasonDriverIds.push(key);
        if(openEvent){ openEvent.inId = key; openEvent.inName = existing.name; }
        return;
      }
      const desc = reserveDescriptorByName(key);
      if(!desc || desc.cost > s.budget) return;
      const id = slugifyReserveName(desc.name);
      s.customDrivers[id] = {id, name:desc.name, nat:desc.nat, rating:desc.rating, cost:desc.cost};
      s.budget -= desc.cost;
      s.drivers.push(id);
      s.strategies[id] = 'balanced';
      if(s.raceTires[id]===undefined) s.raceTires[id]='medium';
      if(s.standingsDrivers[id]===undefined) s.standingsDrivers[id]=0;
      if(s.rivalry.headToHead[id]===undefined) s.rivalry.headToHead[id]=0;
      if(!s.seasonDriverIds.includes(id)) s.seasonDriverIds.push(id);
      if(openEvent){ openEvent.inId = id; openEvent.inName = desc.name; }
    });
  },
  goToQualiPrep(){
    update(s=>{ s.raceStage = 'qualiPrep'; });
  },
  goToRaceStartPrep(){
    update(s=>{ s.raceStage = 'raceStartPrep'; });
  },
  startSkillChecks(stage){
    update(s=>{
      s.skillStage = stage;
      s.skillIndex = 0;
      s.skillHits = 0;
      s.skillTotal = stage==='quali' ? 5 : 10;
      s.raceStage = stage==='quali' ? 'qualiSkill' : 'raceSkill';
      s.qualiFirstLaunched = false;
    });
  },
  launchFirstSkillCheck(){
    update(s=>{ s.qualiFirstLaunched = true; });
  },
  recordSkillCheck(success){
    update(s=>{
      if(success) s.skillHits += 1;
      s.skillIndex += 1;
      if(s.skillIndex < s.skillTotal) return; // more checks to go, just re-render the next one
      // sequence complete: turn hits into a score bonus/penalty (par = half correct = neutral)
      const bonus = (s.skillHits - s.skillTotal/2) * 1.0;
      s.skillBonusQuali = bonus;
      simulateQualifying();
      s.raceStage = 'qualiResults';
      s.skillStage = null;
    });
  },
  runRace(){
    update(s=>{
      simulateRace();
      applyRacePayouts();
      applyLoanRepayment();
      applyDriverDevelopmentGain();
      s.raceStage='results';
    });
  },
  startRaceLights(){
    update(s=>{
      s.raceStartIndex = 0;
      s.raceStartResults = {};
      s.raceStage = 'raceStartAnnounce';
    });
  },
  confirmRaceStartAnnounce(){
    update(s=>{ s.raceStage = 'raceStart'; });
  },
  recordRaceStart(type, reactionMs){
    update(s=>{
      const d = myDrivers()[s.raceStartIndex];
      if(d){ s.raceStartResults[d.id] = {type, reactionMs}; }
      s.raceStartIndex += 1;
      if(s.raceStartIndex < 2){ s.raceStage = 'raceStartAnnounce'; return; } // announce the next driver
      simulateRace();
      applyRacePayouts();
      applyLoanRepayment();
      applyDriverDevelopmentGain();
      s.raceStage = 'results';
    });
  },
  proceedToStrategy(){
    update(s=>{ s.raceStage='strategy'; });
  },
  nextRace(){
    update(s=>{
      advanceAiDevelopment();
      s.raceIndex += 1;
      s.raceStage='quali';
      s.qualiGrid={};
      s.qualiResults=null;
      s.lastResults=null;
      s.skillStage=null;
      s.skillIndex=0;
      s.skillHits=0;
      s.skillBonusQuali=0;
      s.skillBonusRace=0;
      s.raceStartIndex=0;
      s.raceStartResults={};
      s.lastSponsorBonus=null;
      s.qualiWeather = pickWeather();
      s.raceWeather = pickWeather();
      s.qualiTire = 'medium';
      s.raceTires = {};
      s.drivers.forEach(id=>{ s.raceTires[id] = 'medium'; });
      refreshSponsorOffers();
      if(s.raceIndex >= CALENDAR.length){
        s.phase='seasonend';
      }
    });
  },
  startNextSeason(){
    update(s=>{ endSeason(); });
  },
  confirmRedraft(){
    if(state.drivers.length!==2){ updateUI(s=>{ s.formError='Seleziona esattamente 2 piloti.'; }); return; }
    update(s=>{
      const newlySigned = s.drivers.filter(id=>!s.previousDrivers.includes(id));
      const cost = newlySigned.reduce((sum,id)=>sum+driverById(id).cost,0);
      if(cost > s.budget){ s.formError='Budget insufficiente per questi ingaggi.'; return; }
      s.budget -= cost;
      s.formError='';
      s.strategies = {};
      s.standingsDrivers = {};
      s.drivers.forEach(id=>{ s.strategies[id]='balanced'; s.standingsDrivers[id]=0; });
      s.standingsConstructors['YOU']=0;
      if(!s.drivers.includes(s.leadDriverId)){ s.leadDriverId = null; }
      s.rivalry = {headToHead:{}};
      s.drivers.forEach(id=>{ s.rivalry.headToHead[id]=0; });
      s.qualiWeather = pickWeather();
      s.raceWeather = pickWeather();
      s.qualiTire = 'medium';
      s.raceTires = {};
      s.drivers.forEach(id=>{ s.raceTires[id] = 'medium'; });
      s.previousDrivers=[];
      s.seasonDriverIds = [...s.drivers];
      s.seasonRosterEvents = [];
      ensureAiTeams();
      refreshSponsorOffers();
      s.phase='season';
      s.activeTab='home';
    });
  },
  resetCareer(){
    updateUI(s=>{ s.confirmingReset = true; });
  },
  cancelResetCareer(){
    updateUI(s=>{ s.confirmingReset = false; });
  },
  confirmResetCareer(){
    state = freshState();
    saveState();
    render();
  },
};

            <div><div class="sponsor-name">${t.label}</div><div style="font-size:10px;color:var(--muted);">Tasso ${Math.round(t.rate*100)}% · ${t.term} gare</div></div>
            <span class="sponsor-value">${fmtM(t.amount)}</span>
          </div>
          <div style="font-size:10px;color:var(--muted);margin-top:8px;">Da restituire: ${fmtM(totalOwed)} totali (${fmtM(installment)}/gara)</div>
          <button class="btn btn-primary btn-sm" style="width:100%;margin-top:10px;" onclick="Actions.requestLoan('${t.id}')">Richiedi Prestito</button>
        </div>`;
      }).join('')}
    `) : ''}

    ${sub==='investor' ? (state.titleInvestor ? `
      <div class="card">
        <div class="card-title">Accordo Attivo <span class="pill on">FINO A FINE STAGIONE</span></div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">Il tuo nome ufficiale per questa stagione è:</div>
        <div style="font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--amber);">${displayTeamName()}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:8px;">Il nome tornerà quello originale all'inizio della prossima stagione, a meno che tu non accetti un nuovo accordo.</div>
      </div>
    ` : `
      <div class="notice">Accetta un investitore esterno per un'iniezione di cash immediata: in cambio, il suo nome verrà aggiunto davanti al nome della tua scuderia per il resto della stagione, come i naming right reali della F1.</div>
      <div class="card-title" style="padding:0 4px;">Offerte Disponibili <button class="btn btn-ghost btn-sm" style="width:auto;float:right;" onclick="Actions.refreshInvestorOffers()">🔄 Aggiorna</button></div>
      ${state.investorOffers.map(o=>`
        <div class="sponsor-card">
          <div class="sponsor-top">
            <div><div class="sponsor-name">${o.name}</div><div style="font-size:10px;color:var(--muted);">Naming rights · resto della stagione</div></div>
            <span class="sponsor-value">${fmtM(o.amount)}</span>
          </div>
          <div style="font-size:10px;color:var(--muted);margin-top:6px;">Il tuo nome diventerebbe: <b>${o.name} ${state.team.name || 'La tua Scuderia'}</b></div>
          <button class="btn btn-primary btn-sm" style="width:100%;margin-top:10px;" onclick="Actions.acceptInvestor('${o.id}')">Accetta Naming Rights</button>
        </div>`).join('')}
    `) : ''}
  </div>`;
}

function viewCareer(){
  return `
  <div class="view">
    <div class="eyebrow">CARRIERA</div>
    <h2 style="font-size:20px;margin:6px 0 14px;">${displayTeamName()}</h2>
    <div class="card grid2">
      <div><div class="season-badge">STAGIONE ATTUALE</div><div class="big-num">${state.season}</div></div>
      <div><div class="season-badge">BUDGET</div><div class="big-num" style="color:var(--green);font-size:20px;">${fmtM(state.budget)}</div></div>
    </div>
    <div class="card">
      <div class="card-title">Storico Stagioni</div>
      ${state.seasonHistory.length===0?'<div class="empty-state">Nessuna stagione completata ancora.</div>':
        [...state.seasonHistory].reverse().map(h=>{
          const champion = h.teamPos===1;
          const swaps = h.rosterChanges||[];
          return `
        <div class="career-row" style="${champion?'background:rgba(255,182,39,0.08);border-radius:6px;padding-left:8px;padding-right:8px;':''}display:block;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div>${champion?'<span style="margin-right:6px;">🏆</span>':''}<span class="szn">S${h.season}</span> <span style="color:${champion?'var(--amber)':'var(--muted)'}">${champion?'· Campione Costruttori':'· P'+h.teamPos+' Costruttori'}</span></div>
            <div class="mono">${h.teamPoints} pt <span style="color:var(--amber)">+${fmtM(h.prize)}</span></div>
          </div>
          ${h.bestDriver && h.bestDriver!=='-' ? `<div style="font-size:10px;color:var(--muted2);margin-top:2px;">Miglior pilota: ${h.bestDriver} (${Math.round(h.bestDriverPts)} pt)</div>` : ''}
          ${swaps.length ? swaps.map(e=>`<div style="font-size:10px;color:var(--muted2);margin-top:2px;">⇄ ${e.outName} → ${e.inName}</div>`).join('') : ''}
        </div>`;
        }).join('')}
    </div>
    <button class="btn btn-outline" onclick="Actions.setTab('home')">← Torna al Box</button>
    <button class="btn btn-ghost" style="margin-top:10px;color:var(--red);" onclick="Actions.resetCareer()">⟲ Resetta Carriera</button>
  </div>`;
}

function viewSeasonEnd(){
  const pos = myConstructorPosition();
  const prizePreview = Math.max(25, 100 - (pos-1)*8);
  const medals = ['🥇','🥈','🥉'];
  const constructorsPodium = Object.entries(state.standingsConstructors).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const driversPodium = Object.entries(state.standingsDrivers).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const constructorsChampion = constructorsPodium[0] && constructorsPodium[0][0]==='YOU';
  return `
  <div class="view">
    <div style="text-align:center;margin:30px 0 20px;">
      <div class="eyebrow">FINE STAGIONE ${state.season}</div>
      <h1 style="font-size:26px;margin-top:8px;">Bandiera a scacchi!</h1>
      ${constructorsChampion?'<div style="margin-top:8px;font-size:15px;color:var(--amber);font-weight:700;">🏆 Sei Campione del Mondo Costruttori!</div>':''}
    </div>
    <div class="card" style="text-align:center;">
      <div class="season-badge">POSIZIONE COSTRUTTORI</div>
      <div class="big-num">P${pos}</div>
      <div style="color:var(--muted);font-size:12px;margin-top:4px;">${Math.round(teamPointsSoFar('YOU'))} punti</div>
    </div>
    <div class="card">
      <div class="card-title">Podio Costruttori</div>
      ${constructorsPodium.map(([name,pts],i)=>{
        const isYou = name==='YOU';
        const label = isYou ? displayTeamName() : name;
        return `<div class="standing-row ${isYou?'you':''}"><div class="p">${medals[i]}</div><div>${label}</div><div class="pt">${Math.round(pts)}</div></div>`;
      }).join('')}
    </div>
    <div class="card">
      <div class="card-title">Podio Piloti</div>
      ${driversPodium.map(([key,pts],i)=>{
        const isYou = state.drivers.includes(key);
        const d = driverById(key);
        const name = d ? d.name : key;
        const teamLabel = driverTeamLabel(key);
        return `<div class="standing-row ${isYou?'you':''}"><div class="p">${medals[i]}</div><div><div>${name}</div>${teamLabel?`<div style="font-size:9px;color:var(--muted2);">${teamLabel}</div>`:''}</div><div class="pt">${Math.round(pts)}</div></div>`;
      }).join('')}
    </div>
    ${(()=>{
      const swaps = (state.seasonRosterEvents||[]).filter(e=>e.inId);
      if(!swaps.length) return '';
      return `<div class="card">
      <div class="card-title">Cambi di Formazione</div>
      ${swaps.map(e=>`<div style="font-size:12px;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--line);"><span style="color:var(--red);">${e.outName}</span> (${Math.round(e.outPts)} pt) → <span style="color:var(--green);">${e.inName}</span></div>`).join('')}
      </div>`;
    })()}
    <div class="card">
      <div class="card-title">Premi & Sviluppo</div>
      <div style="font-size:12px;color:var(--muted);line-height:1.7;">
        + Premio di fine stagione: <b style="color:var(--green)">${fmtM(prizePreview)}</b><br>
        Il livello del garage resta invariato: nessun progresso viene perso.<br>
        Nuovo calendario di ${CALENDAR.length} gare in arrivo.
      </div>
    </div>
    <button class="btn btn-primary" onclick="Actions.startNextSeason()">Vai al Mercato Piloti →</button>
  </div>`;
}

/* =============================== RENDER ROUTER =============================== */
function render(){
  if(!state) return;
  let html = '';
  html += viewTopbar();
  if(state.phase==='setup'){ html += viewSetup(); }
  else if(state.phase==='draft'){ html += viewDraft(); }
  else if(state.phase==='redraft'){ html += viewRedraft(); }
  else if(state.phase==='seasonend'){ html += viewSeasonEnd(); }
  else {
    const tab = state.activeTab;
    if(tab==='home') html += viewHome();
    else if(tab==='garage') html += viewGarage();
    else if(tab==='race') html += viewRace();
    else if(tab==='standings' || tab==='standings-c') html += viewStandings();
    else if(tab==='career') html += viewCareer();
    else if(tab==='midmarket') html += viewMidSeasonMarket();
    else if(tab==='finance' || tab==='finance-loan' || tab==='finance-investor') html += viewFinance();
    else html += viewHome();
  }
  html += viewBottomNav();
  if(state.confirmingReset){
    html += `
    <div class="modal-overlay">
      <div class="modal-box">
        <h3>Resettare la carriera?</h3>
        <p>Perderai team, piloti, budget, garage e tutto lo storico stagioni. Questa azione è irreversibile.</p>
        <div class="modal-actions">
          <button class="btn btn-outline" onclick="Actions.cancelResetCareer()">Annulla</button>
          <button class="btn btn-primary" style="background:var(--red);" onclick="Actions.confirmResetCareer()">Resetta</button>
        </div>
      </div>
    </div>`;
  }
  if(state.pendingRescindDriverId){
    const d = driverById(state.pendingRescindDriverId);
    html += `
    <div class="modal-overlay">
      <div class="modal-box">
        <h3>Rescindere il contratto?</h3>
        <p>${d?d.name:'Il pilota'} lascerà la squadra immediatamente, senza rimborso. Dovrai ingaggiare un sostituto prima del prossimo weekend di gara.</p>
        <div class="modal-actions">
          <button class="btn btn-outline" onclick="Actions.cancelRescind()">Annulla</button>
          <button class="btn btn-primary" style="background:var(--red);" onclick="Actions.confirmRescind()">Rescindi</button>
        </div>
      </div>
    </div>`;
  }
  document.getElementById('app').innerHTML = html;
  const onReadyScreen = state.raceStage==='qualiSkill' && state.skillIndex===0 && !state.qualiFirstLaunched;
  if(state.phase==='season' && state.activeTab==='race' && (state.raceStage==='qualiSkill' || state.raceStage==='raceSkill') && !onReadyScreen){
    initSkillCheckRound();
  }
  if(state.phase==='season' && state.activeTab==='race' && state.raceStage==='raceStart'){
    initRaceStartRound();
  }
}

/* =============================== BRAKING POINT MINI-GAME (qualifying) =============================== */
// A car makes one pass toward the corner (no back-and-forth): tap FRENA while
// it's inside the green zone. Runs independently of the render cycle (pure
// CSS animation + timestamp math), so tapping doesn't need a re-render.
function initSkillCheckRound(){
  const zoneWidth = 14 + Math.random()*6; // 14-20% wide braking zone
  const zoneStart = 40 + Math.random()*(78 - zoneWidth - 40); // braking happens in the back half, before the corner
  // slightly faster (harder) as the sequence goes on
  const duration = Math.max(750, 1150 - state.skillIndex*35 - Math.random()*150);
  window.__skillCheckState = { startTime: Date.now(), duration, zoneStart, zoneWidth, resolved:false };
  const zoneEl = document.getElementById('brakeZone');
  const carEl = document.getElementById('brakeCar');
  if(zoneEl){ zoneEl.style.left = zoneStart+'%'; zoneEl.style.width = zoneWidth+'%'; }
  if(carEl){
    carEl.style.left = '0%';
    carEl.style.animation = `brakemove ${duration}ms linear forwards`;
  }
  const fb = document.getElementById('skillFeedback');
  if(fb) fb.textContent = '';
}

function handleSkillCheckTap(){
  const s = window.__skillCheckState;
  if(!s || s.resolved) return;
  s.resolved = true;
  const elapsed = Date.now() - s.startTime;
  const pos = Math.min(100, (elapsed/s.duration)*100);
  const success = pos >= s.zoneStart && pos <= (s.zoneStart + s.zoneWidth);
  const tooEarly = pos < s.zoneStart;
  const fb = document.getElementById('skillFeedback');
  if(fb){
    fb.textContent = success ? 'FRENATA PERFETTA ✓' : (tooEarly ? 'FRENATA ANTICIPATA ✗' : 'FRENATA TARDIVA ✗');
    fb.style.color = success ? 'var(--green)' : 'var(--red)';
  }
  const carEl = document.getElementById('brakeCar');
  if(carEl){ carEl.style.animation = 'none'; carEl.style.left = pos+'%'; carEl.style.filter = success ? 'none' : 'grayscale(0.5)'; }
  setTimeout(()=>{ Actions.recordSkillCheck(success); }, 550);
}

/* =============================== RACE START LIGHTS (F1 reaction test) =============================== */
function clearRaceStartTimers(){
  if(window.__raceStartTimers){ window.__raceStartTimers.forEach(t=>clearTimeout(t)); }
  window.__raceStartTimers = [];
}

function initRaceStartRound(){
  clearRaceStartTimers();
  const startTime = Date.now();
  const allOnAt = 2500; // 5 lights, 500ms apart
  const holdTime = 400 + Math.random()*2200; // random hold before extinguish, like real F1
  const extinguishAt = allOnAt + holdTime;
  window.__raceStartState = { startTime, allOnAt, extinguishAt, resolved:false };
  window.__raceStartTimers = [];
  for(let i=1;i<=5;i++){
    const timer = setTimeout(()=>{
      const el = document.getElementById('light'+i);
      if(el) el.classList.add('on');
    }, i*500);
    window.__raceStartTimers.push(timer);
  }
  const extTimer = setTimeout(()=>{
    for(let i=1;i<=5;i++){
      const el = document.getElementById('light'+i);
      if(el) el.classList.remove('on');
    }
  }, extinguishAt);
  window.__raceStartTimers.push(extTimer);
  const fb = document.getElementById('raceStartFeedback');
  if(fb) fb.textContent = '';
}

function handleRaceStartTap(){
  const s = window.__raceStartState;
  if(!s || s.resolved) return;
  s.resolved = true;
  clearRaceStartTimers();
  const elapsed = Date.now() - s.startTime;
  let type, reactionMs = 0;
  if(elapsed < s.extinguishAt){
    type = 'jumpstart';
  } else {
    reactionMs = elapsed - s.extinguishAt;
    if(reactionMs < 200) type = 'perfect';
    else if(reactionMs < 450) type = 'good';
    else if(reactionMs < 900) type = 'slow';
    else type = 'verySlow';
  }
  // make sure the lights end up visually off regardless of when the tap landed
  for(let i=1;i<=5;i++){
    const el = document.getElementById('light'+i);
    if(el) el.classList.remove('on');
  }
  const labels = { jumpstart:'🚫 PARTENZA ANTICIPATA!', perfect:'⚡ PARTENZA PERFETTA!', good:'✅ Buona partenza', slow:'⏱️ Partenza lenta', verySlow:'🐢 Partenza molto lenta' };
  const colors = { jumpstart:'var(--red)', perfect:'var(--green)', good:'var(--green)', slow:'var(--amber)', verySlow:'var(--red)' };
  const fb = document.getElementById('raceStartFeedback');
  if(fb){
    fb.textContent = labels[type] + (type!=='jumpstart' ? ` (${reactionMs}ms)` : '');
    fb.style.color = colors[type];
  }
  setTimeout(()=>{ Actions.recordRaceStart(type, reactionMs); }, 700);
}

/* =============================== INIT =============================== */
Actions.init();
</script>
